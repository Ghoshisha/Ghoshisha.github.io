# The scoring, parsing and dedupe rules are the part that has to be correct, so they
# run on every push. The tests that need the real reference files skip themselves --
# those files contain real student data and are gitignored.
name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest pypdf
      - run: python -m pytest -q
