# Render service definition (spec §11). Render can also be configured through its
# dashboard; this keeps the settings in version control.
services:
  - type: web
    name: topsheet-generator-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Comma-separated list of origins allowed by CORSMiddleware. Must include the
      # GitHub Pages origin, e.g. https://<username>.github.io
      - key: ALLOWED_ORIGINS
        sync: false
